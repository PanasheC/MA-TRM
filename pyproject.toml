[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-trm"
version = "0.1.0"
description = "Recursive Multi-Agent Tiny Recursive Models for latent-space structured reasoning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Panashe Chiurunge" }]
keywords = [
  "recursive reasoning",
  "multi-agent systems",
  "latent communication",
  "ARC-AGI",
  "tiny models",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "einops==0.8.1",
  "pydantic==2.11.7",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "tqdm==4.67.1",
]

[project.urls]
Repository = "https://github.com/PanasheC/MA-TRM"
Paper = "https://github.com/PanasheC/MA-TRM/tree/main/paper"

[tool.setuptools.packages.find]
include = ["models*", "dataset*", "evaluators*", "utils*", "train*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["kaggle", "checkpoints", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["kaggle", "data"]
